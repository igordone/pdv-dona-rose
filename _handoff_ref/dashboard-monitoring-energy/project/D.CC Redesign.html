<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>D.CC — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F5F5F4;
    color: #1C1917;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  * { box-sizing: border-box; }
  input::placeholder, textarea::placeholder { color: #A8A29E; }
  button { font-family: 'Manrope', sans-serif; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { DesignCanvas, DCSection, DCArtboard } = window;

const ART_W = 1280;
const ART_H = 860;

function App() {
  return (
    <DesignCanvas
      title="D.CC — Redesign do painel de gestão"
      subtitle="5 telas redesenhadas · sistema visual unificado · mantém laranja primário e estrutura de navegação"
    >
      <DCSection id="screens" title="Painel completo">
        <DCArtboard id="dashboard"  label="01 · Dashboard"            width={ART_W} height={ART_H}>
          <DashboardScreen />
        </DCArtboard>
        <DCArtboard id="cardapio"   label="02 · Cardápio"             width={ART_W} height={ART_H}>
          <CardapioScreen />
        </DCArtboard>
        <DCArtboard id="gestao"     label="03 · Gestão"               width={ART_W} height={ART_H}>
          <GestaoScreen />
        </DCArtboard>
        <DCArtboard id="historico"  label="04 · Histórico de vendas"  width={ART_W} height={ART_H}>
          <HistoricoScreen />
        </DCArtboard>
        <DCArtboard id="perdas"     label="05 · Perdas"               width={ART_W} height={ART_H}>
          <PerdasScreen />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
